name = "tokobuku-v2"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static Assets Routing
[assets]
directory = "."
binding = "ASSETS"

# Native Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "gudangbuku-db"
database_id = "gudangbuku-db"
