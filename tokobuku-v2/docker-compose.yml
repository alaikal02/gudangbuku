version: '3.8'

services:
  tokobuku-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT:-8000}
        SUPABASE_URL: ${SUPABASE_URL:-}
        SUPABASE_KEY: ${SUPABASE_KEY:-}
    container_name: darussholah_tokobuku
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - HOST=0.0.0.0
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./books.json:/app/books.json
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-8000}/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
