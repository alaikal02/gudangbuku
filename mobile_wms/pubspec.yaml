name: mobile_wms
description: "Aplikasi Mobile WMS Gudang Buku - Flutter 3.x with Offline-First Architecture"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components & State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  cupertino_icons: ^1.0.6

  # Camera & Barcode Scanner
  mobile_scanner: ^5.0.0

  # Offline Database & Local Storage
  sqflite: ^2.3.2
  path: ^1.9.0
  uuid: ^4.4.0

  # Connectivity & Network
  connectivity_plus: ^6.0.3
  dio: ^5.4.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
