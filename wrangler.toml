name = "gudangbuku"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static Assets Routing (Points to frontend folder)
[assets]
directory = "tokobuku-v2"
binding = "ASSETS"

# Native Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "gudangbuku-db"
database_id = "gudangbuku-db"
